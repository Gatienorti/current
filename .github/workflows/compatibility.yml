name: Compatibility

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test tests/frontend/*.test.cjs
  matrix:
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: rows
        run: |
          python3 - <<'PY'
          import json, os
          with open('tests/compatibility/matrix.json') as source:
              matrix = json.load(source)
          rows = {'include': [{'row': name, 'php': data['php']} for name, data in matrix.items()]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('rows=' + json.dumps(rows), file=output)
          PY
  test:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.rows) }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LENS_REDIS_HOST: 127.0.0.1
      CURRENT_REQUIRE_SUPERVISOR_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite, sqlite3, redis, pcntl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build and test optional collector
        working-directory: collector
        run: |
          go test -race ./...
          go build -o current-collector .
      - name: Build and test native supervisor
        working-directory: supervisor
        run: |
          go test -race ./...
          CGO_ENABLED=0 go build -o current-supervisor .
      - run: composer validate --no-check-publish
      - name: Resolve and test isolated consumer
        run: php tests/compatibility/run.php "${{ matrix.row }}"
  async-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.4
            driver: mysql
          - image: mariadb:11.4
            driver: mariadb
          - image: mariadb:11.4
            driver: mysql
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LENS_REDIS_HOST: 127.0.0.1
      CURRENT_REQUIRE_COLLECTOR_TESTS: '1'
      CURRENT_ASYNC_DB_HOST: 127.0.0.1
      CURRENT_ASYNC_DB_DRIVER: ${{ matrix.driver }}
      CURRENT_ASYNC_DB_PASSWORD: current-test-only
      CURRENT_ASYNC_TLS_DIR: /tmp/current-telemetry-tls
      CURRENT_ASYNC_TLS_WRONG_HOST: current-wrongname
      CURRENT_ASYNC_SOAK_SECONDS: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_sqlite, pdo_mysql, redis, pcntl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go build -o current-collector .
        working-directory: collector
      - run: composer install --no-interaction --prefer-dist
      - name: Start TLS-enforced disposable SQL server
        env:
          SQL_IMAGE: ${{ matrix.image }}
        run: |
          bash tests/telemetry/create-tls-fixtures.sh "$CURRENT_ASYNC_TLS_DIR"
          echo '127.0.0.1 current-wrongname' | sudo tee -a /etc/hosts
          docker run -d --name current-async-sql-test -p 3306:3306 -v "$CURRENT_ASYNC_TLS_DIR:/tls:ro" -e MYSQL_ROOT_PASSWORD=current-test-only -e MYSQL_DATABASE=current_async_test "$SQL_IMAGE" --ssl-ca=/tls/ca.pem --ssl-cert=/tls/server.pem --ssl-key=/tls/server-key.pem --require-secure-transport=ON
          if [[ "$SQL_IMAGE" == mariadb:* ]]; then client=mariadb; else client=mysql; fi
          for attempt in $(seq 1 40); do
            if docker exec current-async-sql-test "$client" -uroot -pcurrent-test-only -e "ALTER USER 'root'@'%' REQUIRE X509" && docker exec current-async-sql-test "$client" --protocol=TCP -h127.0.0.1 -uroot -pcurrent-test-only --ssl-ca=/tls/ca.pem --ssl-cert=/tls/client.pem --ssl-key=/tls/client-key.pem -e "SELECT 1"; then break; fi
            if [ "$attempt" = 40 ]; then exit 1; fi
            sleep 2
          done
      - name: Prepare disposable test storage
        run: mkdir -p prototype/bootstrap/cache prototype/storage/data prototype/storage/logs prototype/storage/framework/{views,cache,sessions}
      - name: Verify maintenance locking and deferred summary parity
        working-directory: collector
        env:
          CURRENT_TEST_SQL_HOST: 127.0.0.1
          CURRENT_TEST_SQL_PASSWORD: current-test-only
        run: go test -race -count=1 -run 'TestSQLMaintenanceAbsenceLock|TestDeferredSummariesOnServerSQL' ./...
      - run: vendor/bin/phpunit -c phpunit.xml --filter 'AsyncTelemetryTest|SynchronousSqlTest'
  dynamodb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, simplexml, pdo_sqlite, sqlite3, redis, pcntl, posix
          tools: composer:v2
          coverage: none
      - name: Install optional SDK in the disposable test checkout
        run: composer require --dev aws/aws-sdk-php:3.402.2 --no-scripts --no-plugins --no-progress --no-interaction
      - name: Prepare storage and wait for local service
        run: |
          mkdir -p prototype/bootstrap/cache prototype/storage/data prototype/storage/logs prototype/storage/framework/{views,cache,sessions}
          for attempt in $(seq 1 30); do
            if php -r '$socket = @fsockopen("127.0.0.1", 8000); exit($socket ? 0 : 1);'; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 1
          done
      - name: Verify actual SDK pagination and conditional deletes
        env:
          CURRENT_DYNAMO_LOCAL_ENDPOINT: http://127.0.0.1:8000
        run: vendor/bin/phpunit -c phpunit.xml --filter NativeDynamoIntegrationTest
