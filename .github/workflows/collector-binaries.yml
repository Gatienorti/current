name: Collector binaries
on:
  push:
    branches: [main]
    paths: ['collector/**', '.github/workflows/collector-binaries.yml']
  pull_request:
    paths: ['collector/**', '.github/workflows/collector-binaries.yml']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build static Linux binary
        env:
          COLLECTOR_VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          docker run --rm -e COLLECTOR_VERSION -v "$PWD/collector:/src" -w /src golang:1.25-alpine sh -c 'apk add --no-cache build-base && sh build-release.sh "$COLLECTOR_VERSION"'
          collector/dist/current-collector-linux-${{ matrix.arch }} --version
          cd collector/dist && sha256sum -c SHA256SUMS-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: current-collector-linux-${{ matrix.arch }}
          path: collector/dist/*
          if-no-files-found: error
  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach binaries and checksums to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*
