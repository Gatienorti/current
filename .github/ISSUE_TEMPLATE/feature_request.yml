name: Feature request
description: Suggest a focused improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to investigate?
      description: Describe the practical problem and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful change and any alternatives you considered.
    validations:
      required: true
